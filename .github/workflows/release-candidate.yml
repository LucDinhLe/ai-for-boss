# Publishes a downloadable build for the Product Owner to run on his own
# machine. Release assets do not count against the account's Actions artifact
# storage, which is what makes this the free path.
#
# The build stays honest about what it is: experimental-internal, unsigned, and
# gated behind the same evidence the pull-request pipeline demands. It runs on a
# tag or on demand, never on every push, because Windows minutes are billed at
# twice the Linux rate.
name: Release candidate

on:
  push:
    tags:
      - "beta-*"
  workflow_dispatch:
    inputs:
      label:
        description: "Label for a manual build (used in the release name)"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  windows:
    name: Build and publish the Windows candidate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24.19.0

      - name: Activate exact package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # A build the Product Owner will actually run has to clear the same bar as
      # a pull request. A red validator here means no download link, by design.
      - name: Lint, type-check, test and build
        run: pnpm verify

      # The evidence check expects both records, and the release build should
      # prove the supervised Gateway works on this machine before it proves the
      # package does.
      - name: Smoke the supervised OpenClaw Gateway
        run: pnpm smoke:gateway

      - name: Stage the bundled Node runtime and OpenClaw
        run: pnpm stage:runtime

      - name: Package the app
        run: pnpm package:desktop

      - name: Validate experimental artifact inventory
        run: node scripts/validate-feature-0.4.mjs --require-artifact

      - name: Smoke the packaged runtime with nothing on PATH
        run: pnpm smoke:packaged

      - name: Launch the packaged app
        run: pnpm smoke:app

      - name: Check the runtime evidence was produced
        run: node scripts/check-evidence.mjs

      # One file to download and one to double-click. NSIS is used from the
      # runner image when present and installed on demand when not, so the
      # repository carries no packaging dependency of its own.
      - name: Build the installer
        id: compress
        shell: pwsh
        run: |
          $source = Get-ChildItem -Path out/desktop -Directory | Select-Object -First 1
          if (-not $source) { throw "no packaged app under out/desktop" }
          $label = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "${{ inputs.label }}-$($env:GITHUB_SHA.Substring(0,7))" }
          $setup = "out/AI-for-Boss-Setup-$label.exe"
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            foreach ($candidate in @("$env:ProgramFiles\NSIS\makensis.exe", "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
              if (Test-Path $candidate) { $makensis = $candidate; break }
            }
          }
          if (-not $makensis) {
            Write-Host "NSIS not on this image, installing it"
            choco install nsis --no-progress -y
            foreach ($candidate in @("$env:ProgramFiles\NSIS\makensis.exe", "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
              if (Test-Path $candidate) { $makensis = $candidate; break }
            }
          }
          if (-not $makensis) { throw "NSIS is not available on this runner" }
          Write-Host "using $makensis"
          & $makensis /DVERSION=$label "/DSOURCE_DIR=$($source.FullName)" "/DOUT_FILE=$((Resolve-Path 'out').Path)\AI-for-Boss-Setup-$label.exe" installer/ai-for-boss.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          $size = [math]::Round((Get-Item $setup).Length / 1MB, 1)
          "asset=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "label=$label" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sizeMb=$size" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "installer $setup ($size MB)"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $label = "${{ steps.compress.outputs.label }}"
          $notes = @"
          Bản thử nghiệm nội bộ, chưa ký số, chưa phát hành.

          **Cài.** Tải một tệp duy nhất ``AI-for-Boss-Setup-$label.exe`` rồi chạy. Windows sẽ hiện màn hình SmartScreen vì bản này chưa có chứng chỉ ký số; bấm **More info** rồi **Run anyway**. Bộ cài không cần quyền quản trị, đặt ứng dụng trong thư mục người dùng, tạo lối tắt ngoài desktop và trong Start menu, kèm mục gỡ cài đặt trong Settings. Máy không cần cài Node hay bất cứ thứ gì khác.

          **Lần đầu mở.** Cửa sổ Kết nối tự bật vì chưa có model nào. Chọn một nhà cung cấp, dán khoá hoặc token, rồi bấm Kiểm tra kết nối. Sau khi kết nối xong Gateway khởi động lại vài giây là dùng được.

          **Kích thước** bộ cài khoảng ${{ steps.compress.outputs.sizeMb }} MB, chiếm khoảng 900 MB sau khi cài, vì gói mang theo Node runtime và toàn bộ OpenClaw.

          **Gỡ cài đặt** không xoá lịch sử trò chuyện và cấu hình, hai thứ đó nằm trong thư mục dữ liệu người dùng.

          **Chưa có trong bản này.** Advisor, skill quản trị kinh doanh, chữ ký số, tự cập nhật.

          Bằng chứng của lượt dựng này nằm trong ``artifacts/beta-0`` của chính commit đã dựng.
          "@
          gh release create $label "${{ steps.compress.outputs.asset }}" --title "AI for Boss $label" --notes $notes --prerelease
