name: Desktop shell

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-14
            label: macos
          - os: ubuntu-latest
            label: linux

    env:
      RELEASE_CLASSIFICATION: experimental-internal

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24.19.0

      - name: Activate exact package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate governance and locked contracts
        shell: pwsh
        run: |
          ./scripts/validate-governance.ps1
          node scripts/validate-runtime-manifest.mjs
          node scripts/validate-feature-0.3.mjs

      - name: Lint, type-check, test and build
        run: pnpm verify

      - name: Audit dependency graph
        run: pnpm audit --audit-level high

      # Beta 0 answers the platform question with the product's own Supervisor
      # and adapter, on a real OpenClaw install, before any packaging claim.
      - name: Smoke the supervised OpenClaw Gateway
        run: pnpm smoke:gateway

      # Stage the runtime the package carries, then prove the package starts
      # its Gateway with nothing on PATH. Together these are the claim the
      # installer will rest on: a clean machine needs nothing installed.
      - name: Stage the bundled Node runtime and OpenClaw
        run: pnpm stage:runtime

      - name: Package current platform
        run: pnpm package:desktop

      - name: Validate experimental artifact inventory
        run: node scripts/validate-feature-0.4.mjs --require-artifact

      - name: Smoke the packaged runtime with nothing on PATH
        run: pnpm smoke:packaged

      # A packaged Electron app is hundreds of megabytes, and three of them on
      # every pull-request run exhausted the account's artifact storage. The
      # inventory carries the sha256 of app.asar and the file counts the
      # validator checks, so pull requests keep the evidence and drop the
      # payload; a run on main or a manual run still uploads the whole package.
      # Evidence from both smokes travels together, and stays small.
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: ai-for-boss-${{ matrix.label }}-gateway-smoke
          path: artifacts/beta-0/
          if-no-files-found: error
          retention-days: 14

      # The packaged app now carries a Node runtime and a full OpenClaw install,
      # so it is close to a gigabyte per platform. Uploading three of those on
      # every run exhausted the account's artifact storage and taught nothing:
      # the inventory carries the app.asar digest, the bundled runtime digest
      # and the file counts the validator checks, and the package rebuilds from
      # a pinned manifest. The installer gate will publish a real signed
      # artifact; until then only the evidence travels.
      - name: Upload internal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: ai-for-boss-${{ matrix.label }}-experimental-internal
          path: out/desktop/artifact-inventory.json
          if-no-files-found: error
          retention-days: 7
