name: Governance

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate governance and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Run governance validation
        shell: pwsh
        run: ./scripts/validate-governance.ps1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 24.19.0

      - name: Activate exact package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate runtime manifest
        run: node ./scripts/validate-runtime-manifest.mjs

      - name: Test all contract guards
        run: node --test ./tests/contract/*.test.mjs

      - name: Validate Feature 0.3 capability and threat contracts
        run: node ./scripts/validate-feature-0.3.mjs

      - name: Validate Feature 0.6 sandbox and CI contracts
        run: node ./scripts/validate-feature-0.6.mjs
