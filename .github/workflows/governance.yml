name: Governance

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate governance and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run governance validation
        shell: pwsh
        run: ./scripts/validate-governance.ps1

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Validate runtime manifest
        run: node ./scripts/validate-runtime-manifest.mjs
