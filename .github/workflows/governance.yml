name: Governance

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate governance and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run governance validation
        shell: pwsh
        run: ./scripts/validate-governance.ps1
